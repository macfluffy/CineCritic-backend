name: Deploy container to cloud

on:
    # Only trigger this workflow when it is called or manually executed  
    workflow_dispatch:
    workflow_call:

env:
    IMAGE_NAME: ${{ github.repository }}
    REGISTRY: ghcr.io

jobs:
    deploy-container-to-cloud:
        runs-on: ubuntu-latest

        permissions:
          id-token: write # required for requesting JWT from Github OIDC provider
          contents: read

        env:
          # Case sensitive, must be in lowercase
          GITHUB_REPOSITORY: macfluffy/cinecritic-backend  
          AWS_REGION: ap-southeast-2
          ECR_REPOSITORY: cinecritic-backend
          ECS_CLUSTER: cinecritic-cluster
          ECS_SERVICE: cinecritic-backend-launcher-service-k4cp27mu
          ECS_TASK_DEFINITION: task-definition.json
          CONTAINER_NAME: cinecritic-backend-container

        steps:
          - name: Checkout the latest version of the code
            uses: actions/checkout@v6

          - name: Configure aws credentials
            uses: aws-actions/configure-aws-credentials@v6.0.0
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ env.AWS_REGION }}
          
          # Uncomment this step to verify your identity is correct
          # - name: Verify aws identity
          #   run: aws sts get-caller-identity

          - name: Fill in the new image id in the amazon ecs task definition
            id: task-definer
            uses: aws-actions/amazon-ecs-render-task-definition@v1
            with:
              task-definition: ${{ env.ECS_TASK_DEFINITION }}
              container-name: ${{ env.CONTAINER_NAME }}
              image: ghcr.io/${{ env.GITHUB_REPOSITORY }}:latest
              environment-variables: |
                POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                DATABASE_URL=${{ secrets.DATABASE_URL }}
                POSTGRES_DB=${{ secrets.POSTGRES_DB }}
                JWT_SECRET=${{ secrets.JWT_SECRET }}
                TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}

          - name: Deploy amazon ecs task definition
            uses: aws-actions/amazon-ecs-deploy-task-definition@v2
            with:
              task-definition: ${{ steps.task-definer.outputs.task-definition }}
              service: ${{ env.ECS_SERVICE }}
              cluster: ${{ env.ECS_CLUSTER }}
              wait-for-service-stability: true