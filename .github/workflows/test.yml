name: Test code

on:
    # Only trigger this workflow when it is called
    workflow_call:

jobs:
    test:
        name: Testing the code
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the latest version of the code
              uses: actions/checkout@v6

            - name: Setup environment
              uses:  actions/setup-node@v6
              with:
                node-version: "24.11.1"
                cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run the test
              env:
                JWT_SECRET: ${{ secrets.JWT_SECRET }}
                TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
                POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
              run: npm run test > report.txt

            - name: Archive the test report
              uses: actions/upload-artifact@v7.0.0
              # Logs the test report even if this job fails
              if: always()
              with:
                name: test_report
                path: testlogs/test_report.txt